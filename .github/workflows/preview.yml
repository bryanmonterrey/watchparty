name: Preview version (no traffic)

# Builds the OpenNext worker off a branch and uploads it as a NEW VERSION of the
# production `watchparty` Worker without deploying it. Cloudflare keeps serving
# the currently-deployed version to 100% of traffic; the upload only becomes
# live if someone promotes it in the dashboard (Deployments → Deploy version).
#
# Why this exists: a local `opennextjs-cloudflare build` passing proves the
# BUILD works, not that the worker runs. Next 16.2.0 built cleanly and then
# crashed at runtime on workerd (opennextjs-cloudflare#1157). The preview URL
# this job prints is the only way to exercise the real runtime — Hyperdrive,
# edge middleware, prefetch manifests — before main auto-deploys to prod.
#
# Secrets are deliberately NOT pushed here: a new version inherits the secrets
# of the currently deployed one, so this job never mutates production secrets.

on:
  push:
    # Long-lived upgrade branches (next-16.3, next-17, …) and anything under
    # preview/. Deliberately NOT main — main is deploy.yml's, and it goes live.
    branches: ["next-*", "preview/**"]
  workflow_dispatch:

concurrency:
  group: cf-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same rationale as deploy.yml — see the comment there.
      - name: Restore Turbopack build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext → Workers)
        run: bunx opennextjs-cloudflare build

      # `versions upload` instantiates every binding locally before uploading,
      # exactly like `deploy` does, so Hyperdrive still demands a connection
      # string. Same quote-stripping as deploy.yml (miniflare rejects a quoted
      # URL as invalid).
      - name: Upload version (does NOT shift traffic)
        run: |
          DBURL="$(grep -E '^DATABASE_URL=' .env | cut -d= -f2-)"
          DBURL="${DBURL%\"}"; DBURL="${DBURL#\"}"
          DBURL="${DBURL%\'}"; DBURL="${DBURL#\'}"
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$DBURL"
          bunx wrangler versions upload | tee version.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Surface the preview URL in the run summary so it's one click from the
      # Actions tab. Requires preview URLs to be enabled on the Worker; if they
      # aren't, wrangler prints the version ID only and this just says so.
      - name: Report preview URL
        if: always()
        run: |
          {
            echo "### Preview version uploaded"
            echo
            echo "Production traffic is **unchanged** — this version is not deployed."
            echo
            if grep -qE 'https://[^ ]*workers\.dev' version.log 2>/dev/null; then
              echo "Preview URL: $(grep -oE 'https://[^ ]*workers\.dev[^ ]*' version.log | head -1)"
            else
              echo "No preview URL printed — enable Preview URLs on the Worker"
              echo "(Cloudflare dashboard → watchparty → Settings → Preview URLs),"
              echo "or promote the version manually to test it."
            fi
            echo
            echo '```'
            cat version.log 2>/dev/null || echo "(no version.log — the upload step failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
