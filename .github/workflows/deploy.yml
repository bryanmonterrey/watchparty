name: Deploy to Cloudflare Workers

# Builds + deploys server-side on GitHub's runners (clean network), which avoids
# the local `wrangler` asset-upload EPIPE. Builds the OpenNext worker, deploys
# it, then pushes runtime secrets to the live Worker.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Reconstruct the env file from a single multi-line secret. `next build`
      # bakes NEXT_PUBLIC_* and runs DB-backed static generation from this.
      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext → Workers)
        run: bunx opennextjs-cloudflare build

      - name: Generate runtime secrets bundle
        run: node scripts/cf/gen-secrets.mjs

      - name: Deploy worker
        # `wrangler deploy` calls `opennextjs-cloudflare deploy`, which instantiates
        # every binding locally (incl. Hyperdrive) before uploading — so it needs a
        # local connection string even though we populate no cache. Point it at the
        # DB from the restored .env (kept out of the Worker's runtime secrets).
        run: |
          # DATABASE_URL may be wrapped in quotes in .env; strip surrounding
          # quotes so the Hyperdrive local connection string is a valid URL
          # (miniflare rejects '"postgres://..."' as an invalid url).
          DBURL="$(grep -E '^DATABASE_URL=' .env | cut -d= -f2-)"
          DBURL="${DBURL%\"}"; DBURL="${DBURL#\"}"
          DBURL="${DBURL%\'}"; DBURL="${DBURL#\'}"
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$DBURL"
          bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push runtime secrets to the Worker
        run: bunx wrangler secret bulk .cf-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The realtime layer is a separate Worker (Durable Objects via partyserver).
  # Independent of the Next/OpenNext worker, so it deploys in parallel.
  deploy-realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # partyserver/partysocket/jose resolve from the root node_modules that
      # wrangler bundles, so install at the repo root.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Deploy realtime worker
        run: bunx wrangler deploy --config realtime/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate realtime secrets bundle
        run: node scripts/cf/gen-realtime-secrets.mjs

      - name: Push REALTIME_SECRET to the realtime worker
        run: bunx wrangler secret bulk realtime/.cf-secrets.json --config realtime/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
