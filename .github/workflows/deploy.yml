name: CI

# The app and console deploy through Vercel's Git integration (projects
# watchpartyv8 + watchparty-console) since the 2026-10-29 move off Cloudflare.
# What's left here: the test/guard/drift gate (informational now — Vercel does
# not wait on it) and the cron worker, the last thing still on Cloudflare.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  # Money-path unit tests gate the site-serving jobs. Pure-logic tests only
  # (bun test ./tests) — fast, no network, no DB; a red test means a wrong
  # trade amount or an emptied board, which is exactly what must not deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overlay private assets
        # Licensed packs + runbooks live in the private watchparty-assets repo
        # (scripts/ci/overlay-private-assets.sh); the public tree builds
        # without them, just imageless.
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: bash scripts/ci/overlay-private-assets.sh
      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: latest
      # setup-bun failed with "socket hang up" on FIVE separate jobs on
      # 2026-08-12 (test, deploy-cron, deploy-og, deploy-realtime,
      # deploy-container) — a transient network error reaching its CDN, not
      # anything about this repo. Because `test` gates the deploy jobs, one
      # flake there skips every deployment.
      #
      # Strictly additive: the action still runs first and this is skipped
      # unless it actually failed, so the normal path is unchanged.
      - name: Install bun (fallback for a flaky setup-bun)
        if: steps.setup-bun.outcome == 'failure'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test ./tests

      # Rules tsc and the test suite structurally cannot see. All are RATCHETS:
      # existing violations are allowlisted, so these block new ones without
      # demanding a repo-wide cleanup first. ("Both" was accurate when there
      # were two of them.)
      - name: Repo guards
        run: |
          node scripts/guards/check-wallet-address-display.mjs
          node scripts/guards/check-file-sizes.mjs
          node scripts/guards/check-text-scale.mjs
          node scripts/guards/check-hover-lighter.mjs
          node scripts/guards/check-dialog-surface.mjs

      # The one gate that can see PRODUCTION's schema.
      #
      # Schema ships as hand-applied SQL under db/, so code and schema deploy
      # independently: a committed-but-unapplied migration is indistinguishable
      # from an applied one to every other check here. On 2026-08-19 a deploy
      # shipped code selecting `user.server_tag_id` while the column existed
      # only locally — tsc, the tests and all five guards passed, and drizzle
      # would have failed EVERY post query the moment the worker went live.
      #
      # Read-only: it selects from information_schema and nothing else. An
      # unreachable database WARNS and passes; only real drift fails, so this
      # cannot turn a Supabase blip into a deploy freeze.
      - name: Restore .env
        run: |
          printf '%s\n' "$DOTENV_PRODUCTION" > .env
          if [ -n "$DOTENV_OVERRIDES" ]; then printf '%s\n' "$DOTENV_OVERRIDES" >> .env; fi
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}
          DOTENV_OVERRIDES: ${{ secrets.DOTENV_OVERRIDES }}

      - name: Schema drift (production)
        run: bun scripts/db/check-drift.ts prod

  deploy-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: latest
      # setup-bun failed with "socket hang up" on FIVE separate jobs on
      # 2026-08-12 (test, deploy-cron, deploy-og, deploy-realtime,
      # deploy-container) — a transient network error reaching its CDN, not
      # anything about this repo. Because `test` gates the deploy jobs, one
      # flake there skips every deployment.
      #
      # Strictly additive: the action still runs first and this is skipped
      # unless it actually failed, so the normal path is unchanged.
      - name: Install bun (fallback for a flaky setup-bun)
        if: steps.setup-bun.outcome == 'failure'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore .env
        # Identical to the assembly in deploy.yml, and it has to stay identical.
        # This step used to apply DOTENV_PRODUCTION only, so anything added via
        # DOTENV_OVERRIDES was live on one deploy path and silently absent on
        # the others — and deploy-container.yml is the one serving the domains.
        # The failure mode is a missing value, not an error: a fee that quietly
        # is not charged, a key that is quietly not set.
        #
        # `%s\n` matters too. Without the trailing newline the first override
        # line concatenates onto the last line of DOTENV_PRODUCTION, corrupting
        # both.
        run: |
          printf '%s\n' "$DOTENV_PRODUCTION" > .env
          if [ -n "$DOTENV_OVERRIDES" ]; then printf '%s\n' "$DOTENV_OVERRIDES" >> .env; fi
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}
          DOTENV_OVERRIDES: ${{ secrets.DOTENV_OVERRIDES }}

      - name: Deploy cron worker
        run: bunx wrangler deploy --config cron/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate cron secrets bundle
        run: node scripts/cf/gen-cron-secrets.mjs

      - name: Push CRON_SECRET to the cron worker
        run: bunx wrangler secret bulk cron/.cf-secrets.json --config cron/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Developer console (console/ sibling app) → its own OpenNext worker,
  # console-app. Standalone on purpose: never competes with the main worker's
  # 10 MiB bundle budget. No .env restore — the console bakes no secrets and
  # serves no /api (the zone route hands console.watchparty.xyz/api/* to the
  # main worker). TWO installs: root deps first, because `next build`
  # type-checks the type-only AppRouter import against ../server, whose types
  # resolve from the ROOT node_modules; then the console's own lockfile.
  notify-failure:
    needs: [test, deploy-cron]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or append the deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — point gh at the repo explicitly.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          short="${COMMIT_SHA:0:7}"
          subject="${COMMIT_MSG%%$'\n'*}"
          body="Deploy **failed** for \`${short}\` — ${subject:-(manual run)}

          Run log: ${RUN_URL}

          ⚠️ Production keeps serving the last *successful* build until this is fixed."
          # Ensure the label exists (idempotent), then sticky: comment on an open
          # issue if one exists, otherwise create one.
          gh label create deploy-failure --color B60205 --description "CI (tests/guards or cron worker deploy) failed" --force || true
          existing="$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "🚨 Production deploy failed" --label deploy-failure --body "$body"
          fi
