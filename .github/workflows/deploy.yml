name: Deploy to Cloudflare Workers

# Builds + deploys server-side on GitHub's runners (clean network), which avoids
# the local `wrangler` asset-upload EPIPE. Builds the OpenNext worker, deploys
# it, then pushes runtime secrets to the live Worker.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  # Money-path unit tests gate the site-serving jobs. Pure-logic tests only
  # (bun test ./tests) — fast, no network, no DB; a red test means a wrong
  # trade amount or an emptied board, which is exactly what must not deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test ./tests

      # Rules tsc and the test suite structurally cannot see. Both are
      # RATCHETS: existing violations are allowlisted, so these block new ones
      # without demanding a repo-wide cleanup first.
      - name: Repo guards
        run: |
          node scripts/guards/check-wallet-address-display.mjs
          node scripts/guards/check-file-sizes.mjs
          node scripts/guards/check-text-scale.mjs

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Next 16.3 turned `experimental.turbopackFileSystemCacheForBuild` ON by
      # default: every `next build` now WRITES ~570MB of Turbopack cache to
      # .next/cache. That only buys anything if the directory is restored first
      # — a bare checkout pays the write cost on every run and reads nothing
      # back. Restore it here (before `bun install`, so hashFiles never walks
      # node_modules) to actually collect the faster-repeat-build win.
      #
      # The key is per-commit so every run saves a fresh cache; the restore-keys
      # fall back to the newest cache for this lockfile, which is still mostly
      # reusable. Entries are evicted LRU against the repo's 10GB budget.
      #
      # Do NOT key on a source glob like hashFiles('**/*.ts', ...). The cache
      # action re-evaluates `key` in its POST step, by which point node_modules,
      # .next and .open-next all exist — the walk then blows GitHub's 120s
      # expression budget, the template is declared invalid, and the save fails
      # (observed on run 30874361145). `github.sha` is free to evaluate and
      # changes exactly as often.
      - name: Restore Turbopack build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Reconstruct the env file from a single multi-line secret. `next build`
      # bakes NEXT_PUBLIC_* and runs DB-backed static generation from this.
      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext → Workers)
        run: bunx opennextjs-cloudflare build

      - name: Generate runtime secrets bundle
        run: node scripts/cf/gen-secrets.mjs

      - name: Deploy worker
        # `wrangler deploy` calls `opennextjs-cloudflare deploy`, which instantiates
        # every binding locally (incl. Hyperdrive) before uploading — so it needs a
        # local connection string even though we populate no cache. Point it at the
        # DB from the restored .env (kept out of the Worker's runtime secrets).
        run: |
          # DATABASE_URL may be wrapped in quotes in .env; strip surrounding
          # quotes so the Hyperdrive local connection string is a valid URL
          # (miniflare rejects '"postgres://..."' as an invalid url).
          DBURL="$(grep -E '^DATABASE_URL=' .env | cut -d= -f2-)"
          DBURL="${DBURL%\"}"; DBURL="${DBURL#\"}"
          DBURL="${DBURL%\'}"; DBURL="${DBURL#\'}"
          export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$DBURL"
          bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push runtime secrets to the Worker
        run: bunx wrangler secret bulk .cf-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The realtime layer is a separate Worker (Durable Objects via partyserver).
  # Independent of the Next/OpenNext worker, so it deploys in parallel.
  deploy-realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # partyserver/partysocket/jose resolve from the root node_modules that
      # wrangler bundles, so install at the repo root.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Deploy realtime worker
        run: bunx wrangler deploy --config realtime/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate realtime secrets bundle
        run: node scripts/cf/gen-realtime-secrets.mjs

      - name: Push REALTIME_SECRET to the realtime worker
        run: bunx wrangler secret bulk realtime/.cf-secrets.json --config realtime/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Cron Triggers worker (premium collect + treasury sweep). Calls the app's
  # guarded /api/cron/* routes on schedule with CRON_SECRET. Standalone worker.
  deploy-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Deploy cron worker
        run: bunx wrangler deploy --config cron/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate cron secrets bundle
        run: node scripts/cf/gen-cron-secrets.mjs

      - name: Push CRON_SECRET to the cron worker
        run: bunx wrangler secret bulk cron/.cf-secrets.json --config cron/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # THE ONE THAT SERVES THE SITE.
  #
  # watchparty.xyz is attached to `watchparty-app`, the Worker that fronts the
  # container — so a push that only rebuilt the `deploy` job above would leave
  # the live site on old code. That happened once already, within an hour of
  # the cutover: a change deployed green and wasn't on the site, because the
  # container image was still the previous commit.
  #
  # The `deploy` job above stays, and stays current, precisely so it remains a
  # working rollback target — reattach the domain to `watchparty` and it's
  # serving this same commit.
  deploy-container:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Needed twice over: NEXT_PUBLIC_* are inlined into the client bundle
      # during the image build, and the rest are pushed as Worker secrets below,
      # which is where the container reads its runtime env from.
      - name: Restore .env
        run: printf '%s' "$DOTENV_PRODUCTION" > .env
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Build image and deploy container worker
        run: bunx wrangler deploy --config container/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate runtime secrets bundle
        run: node scripts/cf/gen-secrets.mjs

      - name: Push secrets to the container worker
        run: bunx wrangler secret bulk .cf-secrets.json --config container/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Loud failure signal: if any deploy job above fails, open (or append to) a
  # sticky GitHub issue so a broken build can't silently leave production stale.
  # A failed deploy means prod keeps serving the last *successful* build.
  notify-failure:
    needs: [deploy, deploy-realtime, deploy-cron, deploy-container]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or append the deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — point gh at the repo explicitly.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          short="${COMMIT_SHA:0:7}"
          subject="${COMMIT_MSG%%$'\n'*}"
          body="Deploy **failed** for \`${short}\` — ${subject:-(manual run)}

          Run log: ${RUN_URL}

          ⚠️ Production keeps serving the last *successful* build until this is fixed."
          # Ensure the label exists (idempotent), then sticky: comment on an open
          # issue if one exists, otherwise create one.
          gh label create deploy-failure --color B60205 --description "CI deploy to Cloudflare failed" --force || true
          existing="$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "🚨 Production deploy failed" --label deploy-failure --body "$body"
          fi
